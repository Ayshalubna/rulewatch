name: Keep RuleWatch awake

# Render's free plan sleeps after 15 minutes without visitors, and the first visitor then waits about a minute.
# GitHub often delays or skips frequent schedules, so this job stays running: it pings the live app every
# 5 minutes for almost 6 hours, then starts its next run itself. The schedule is only a backup starter.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: keep-awake
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Ping the live app every 5 minutes
        run: |
          for i in $(seq 1 70); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://rulewatch.onrender.com/api/meta || echo "000")
            echo "$(date -u +%H:%M) ping $i -> $code"
            sleep 300
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keep-awake.yml --repo "$GITHUB_REPOSITORY" --ref main
